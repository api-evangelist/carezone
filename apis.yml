name: Carezone
description: 'CareZone is a consumer digital-health company (Care Zone Inc., backed by Obvious Ventures)
  offering a medication-management and family health-organization platform. Its mobile app lets people
  scan pill bottles to track medications, set reminders, log health readings such as blood glucose and
  blood pressure, and organize care information for themselves and loved ones, with a free medication
  delivery service and Medicare savings consultations. CareFlow, CareZone''s pharmacy platform, automates
  traditional pharmacy workflows behind an ecommerce experience. The app reports over 5 million installs.
  CareZone operates as a consumer product and does not publish a public developer program, API
  documentation, or SDKs; this profile captures its public identity and domain-security posture.'
